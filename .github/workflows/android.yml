name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK and install API 35
        shell: bash
        run: |
          set -e
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then echo 'sdkmanager not found'; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify public downloadable resources
        run: python3 scripts/verify_resource_pack.py
      - name: Build and test
        run: gradle --no-daemon --info :app:testDebugUnitTest :app:assembleDebug
      - name: Upload JUnit and HTML test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiftGuard-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload screen gallery from runtime rendering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiftGuard-screen-gallery
          path: app/build/screenshots/*.png
          if-no-files-found: ignore
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RiftGuard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
