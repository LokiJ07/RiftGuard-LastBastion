name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK and install API 35
        shell: bash
        run: |
          set -e
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then echo 'sdkmanager not found'; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      # Development-only signing. Cache persists the same debug identity across CI builds.
      # Production releases must use a separate protected signing secret.
      - name: Reuse stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: riftguard-debug-signing-key-v1
      - name: Ensure development signing key exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=RiftGuard CI Debug, O=RiftGuard, C=PH" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -list -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey >/dev/null
      - name: Verify public downloadable resources
        run: python3 scripts/verify_resource_pack.py
      - name: Build and test
        run: gradle --no-daemon --info :app:testDebugUnitTest :app:assembleDebug
      - name: Upload JUnit and HTML test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiftGuard-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload screen gallery from runtime rendering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiftGuard-screen-gallery
          path: app/build/screenshots/*.png
          if-no-files-found: ignore
      - name: Report APK signing certificate
        if: success()
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RiftGuard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
