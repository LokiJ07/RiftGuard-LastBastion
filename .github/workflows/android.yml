name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/v067-combat-feel-hud-boss-polish, feature/v068-tactical-engagement, feature/v069-dynamic-missions, feature/v070-per-node-weapon-evolution, feature/v071-ten-realm-boss-counterplay, feature/v072-commercial-release-gates]
  workflow_dispatch:
  # Nightly automated regression run: 11:21 AM in Asia/Manila (UTC+8).
  # These runs are visible in GitHub Actions; they do not automatically change code.
  schedule:
    - cron: '21 3 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK and install API 36
        shell: bash
        run: |
          set -e
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then echo 'sdkmanager not found'; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # Development-only signing. Cache persists the same debug identity across CI builds.
      # Production releases must use a separate protected signing secret.
      - name: Reuse stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: riftguard-debug-signing-key-v1
      - name: Ensure development signing key exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=RiftGuard CI Debug, O=RiftGuard, C=PH" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -list -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey >/dev/null
      - name: Verify public downloadable resources
        run: python3 scripts/verify_resource_pack.py
      - name: Commercial packaging preflight (not approval)
        run: python3 scripts/release_gate.py --mode preflight --output app/build/release-audit.json
      - name: Test Android 10/16 graphics telemetry parser
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build and test
        run: gradle --no-daemon --info :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease
      - name: Upload release policy preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiftGuard-release-policy-preflight
          path: app/build/release-audit.json
          if-no-files-found: ignore
      - name: Upload JUnit and HTML test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiftGuard-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload screen gallery from runtime rendering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiftGuard-screen-gallery
          path: app/build/screenshots/*.png
          if-no-files-found: ignore
      - name: Report APK signing certificate
        if: success()
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RiftGuard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Build output is UNSIGNED until production keystore is supplied securely.
      # Keep it an internal CI diagnostic; do NOT submit this bundle to Play.
      - name: Upload unsigned release AAB for package validation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RiftGuard-UNSIGNED-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload software Canvas benchmark measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiftGuard-render-benchmarks
          path: app/build/performance/*.json
          if-no-files-found: ignore

  emulator-smoke:
    name: Android emulator APK + input + graphics diagnostics
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: RiftGuard-debug-apk
          path: app/build/outputs/apk/debug
      - name: Enable KVM on Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Retry transient corrupted Android emulator ZIP install
        shell: bash
        run: |
          set -euo pipefail
          MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          for attempt in 1 2 3; do
            if "$MANAGER" --install "emulator"; then
              echo "Android emulator SDK ready"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Emulator SDK download failed after three attempts"
              exit 1
            fi
            rm -rf "$ANDROID_HOME/.temp" || true
            sleep 9
          done
      - name: Boot real Android emulator and exercise installed game
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/emulator_smoke.sh
      - name: Publish emulator screenshots, crashes and frame diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiftGuard-android-emulator-qa
          path: app/build/emulator-qa/
          if-no-files-found: warn
