plugins {
    id 'com.android.application'
}

// Optional production signing uses protected CI environment variables.
// NO keystore or password is stored in the repository. Without ALL inputs,
// the original development release bundle stays deliberately unsigned.
def releaseKeystoreFile = System.getenv('RIFTGUARD_RELEASE_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('RIFTGUARD_RELEASE_STORE_PASSWORD')
def releaseAlias = System.getenv('RIFTGUARD_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('RIFTGUARD_RELEASE_KEY_PASSWORD')
def productionSigningEnabled = [releaseKeystoreFile, releaseStorePassword,
        releaseAlias, releaseKeyPassword].every { it != null && !it.isEmpty() }

android {
    namespace 'com.lokij07.riftguard'
    compileSdk 36

    defaultConfig {
        applicationId 'com.lokij07.riftguard'
        minSdk 24
        targetSdk 36
        versionCode 78
        versionName '0.82.0-alpha1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (productionSigningEnabled) {
            production {
                storeFile file(releaseKeystoreFile)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            // Production workflow refuses alpha versions and checks the JAR
            // signature on the final AAB. Normal dev CI stays unsigned.
            if (productionSigningEnabled) {
                signingConfig signingConfigs.production
            }
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = true
            all {
                systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
                systemProperty 'robolectric.dependency.repo.id', 'mavenCentral'
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
